<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Symptom Log</title>
<meta name="description" content="Track IBS-D, fibromyalgia, mood, anxiety and daily life, find what affects you, and share a brief with your doctor.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Symptom Log">
<meta name="theme-color" content="#f1f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1618" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column — sticky condition tabs, entry form on top, that condition's recent log below; a Sheet tab holds the full running table and export. */
:root{
  --bg:#f1f5f5; --surface:#ffffff; --ink:#16252a; --muted:#5a6d72; --line:#d5e0e1; --accent:#1d6c75;
  --ibs:#c0651a; --fibro:#a8418f; --mdd:#2d72c4; --gad:#1f8a50; --pos:#c2532f; --neg:#3a7fa8; --worse:#c8502e; --better:#22897c; --meal:#b2453a; --sleep:#4a4c9c; --walk:#5e7d16; --meds:#0f7e8c; --light:#a67908; --screen:#5f6b86; --other:#8a6a4a; --leisure:#c2477a; --relax:#6c5ad6; --selfcare:#2b8aa8; --danger:#b23b3b;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgb(22 37 42 / .05), 0 10px 30px -14px rgb(22 37 42 / .18); --glass:rgb(255 255 255 / .92);
}
*{--tint:color-mix(in srgb, var(--c, var(--accent)) 12%, var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162125; --ink:#e2eced; --muted:#91a5a9; --line:#283a3e; --accent:#5db4bc;
  --ibs:#c87a2c; --fibro:#c45a98; --mdd:#4a87d6; --gad:#2fa268; --pos:#d9744f; --neg:#5a9fcc; --worse:#e0754f; --better:#3fb3a3; --meal:#ee8a7f; --sleep:#a3a6f0; --walk:#a9cc5c; --meds:#3fb0bf; --light:#d9a83a; --screen:#98a3bd; --other:#c9a67e; --leisure:#e886ad; --relax:#a99cf2; --selfcare:#5fbcd9; --danger:#ec7d7d; --shadow:0 1px 0 rgb(255 255 255 / .03) inset, 0 12px 30px -16px rgb(0 0 0 / .6); --glass:rgb(26 39 44 / .93); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162125; --ink:#e2eced; --muted:#91a5a9; --line:#283a3e; --accent:#5db4bc;
  --ibs:#c87a2c; --fibro:#c45a98; --mdd:#4a87d6; --gad:#2fa268; --pos:#d9744f; --neg:#5a9fcc; --worse:#e0754f; --better:#3fb3a3; --meal:#ee8a7f; --sleep:#a3a6f0; --walk:#a9cc5c; --meds:#3fb0bf; --light:#d9a83a; --screen:#98a3bd; --other:#c9a67e; --leisure:#e886ad; --relax:#a99cf2; --selfcare:#5fbcd9; --danger:#ec7d7d; --shadow:0 1px 0 rgb(255 255 255 / .03) inset, 0 12px 30px -16px rgb(0 0 0 / .6); --glass:rgb(26 39 44 / .93); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:env(safe-area-inset-top, 0px) calc(170px + env(safe-area-inset-bottom, 0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{padding-top:22px;display:flex;flex-direction:column;gap:2px}
h1{font:700 2.1rem/1.05 var(--display);margin:0;letter-spacing:-.02em}
.today{color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
h2{font:700 1.15rem/1.2 var(--display);margin:0;text-wrap:balance}
.lbl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* type picker: one sticky scrolling row */
.typebar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px 10px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline:16px;align-items:center}
.typebar::-webkit-scrollbar{display:none}
.typebar[hidden]{display:none}
.tsep{flex:0 0 auto;width:1.5px;height:24px;margin:0 4px;border-radius:1px;background:var(--line)}
.tgrp{flex:0 0 auto;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 2px 0 6px}
.tgrp:not(:first-child){margin-left:6px;padding-left:10px;border-left:1.5px solid var(--line)}
.tchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:700 .88rem var(--body);padding:9px 14px;border-radius:999px;border:0;
  background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 0 0 1px var(--line) inset}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tchip[aria-selected="true"]{background:var(--c);color:var(--surface);box-shadow:0 6px 16px -8px var(--c)}
.tchip[aria-selected="true"] i{background:var(--surface)}
/* bottom tab bar: floating glass capsule */
.tabbar{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  width:min(380px, calc(100% - 32px));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:30px;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 12px 32px -10px rgb(0 0 0 / .28),0 2px 6px rgb(0 0 0 / .06)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border:0;border-radius:24px;
  background:transparent;color:var(--ink);font:700 .74rem var(--body);letter-spacing:.01em;cursor:pointer;opacity:.72}
.tabbar svg{width:26px;height:26px;display:block}
.tabbar button[aria-selected="true"]{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.tabbar button:active{transform:scale(.94)}
.savebar{position:fixed;left:0;right:0;z-index:14;bottom:calc(84px + env(safe-area-inset-bottom, 0px));
  padding:14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.savebar .primary{max-width:560px;margin:0 auto;display:block;box-shadow:0 10px 24px -12px var(--c)}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){button{transition:transform .12s ease,background-color .15s,box-shadow .15s,color .15s}}
.typebar button:focus-visible,.tabbar button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hint{color:var(--muted);font-size:.8rem}
input[type=datetime-local],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
input[type=datetime-local]:focus,input[type=text]:focus,textarea:focus{border-color:var(--c);background:var(--surface);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
textarea{min-height:76px;resize:vertical}
.big{font:700 2rem/1 var(--display);color:var(--c);font-variant-numeric:tabular-nums}
.big small{font-size:.9rem;color:var(--muted);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;--p:30%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--c) var(--p),color-mix(in srgb,var(--line) 80%,var(--bg)) var(--p))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--line) 80%,var(--bg))}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 2px 8px rgb(0 0 0 / .2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 2px 8px rgb(0 0 0 / .2)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 30%,transparent)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:-6px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.9rem;padding:9px 14px;min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--c);color:var(--ink);font-weight:700}
.seg.sq{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.seg.sq .chip{border-radius:12px;padding:10px 0;text-align:center;font-weight:700}
/* iOS-style segmented control */
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:13px;background:color-mix(in srgb,var(--line) 55%,var(--bg))}
.segc .chip{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-size:.88rem;color:var(--muted);font-weight:700;min-width:0}
.segc .chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12),0 0 0 1.5px var(--c) inset}
.stepper{display:flex;align-items:center;gap:12px}
.stepper{background:var(--bg);border-radius:14px;padding:4px;align-self:flex-start}
.stepper button{width:46px;height:46px;border-radius:11px;border:0;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .1);color:var(--ink);font:700 1.3rem var(--body);cursor:pointer}
.stepper output{font:700 1.4rem var(--display);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}

.primary{font:700 1.02rem var(--body);padding:16px;border-radius:16px;border:0;background:var(--c);color:var(--surface);cursor:pointer;width:100%}
.ghost{font:700 .9rem var(--body);padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.sev{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:700 1.15rem var(--display);
  background:var(--tint);color:var(--c);font-variant-numeric:tabular-nums}
.entry .when{font-weight:700;font-size:.9rem}
.entry .det{color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.del{font:inherit;font-size:.8rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}
.del.arm{color:var(--danger);font-weight:700}
.empty{color:var(--muted);padding:14px 0;font-size:.95rem}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;font-size:.85rem;min-width:640px;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
td.n{font-variant-numeric:tabular-nums;font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--c);white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.85rem;color:var(--muted)}
.crisis{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.banner{background:var(--tint);border:1px solid var(--danger);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem;--c:var(--danger)}

.ins{display:flex;flex-direction:column;gap:16px}
.ins .row h2{font-size:1.4rem}
.rng .chip{padding:7px 4px;font-size:.85rem}
.ins svg{width:100%;height:auto;display:block;overflow:visible}
.ins svg [data-tip]{cursor:pointer;outline:none}
.ins svg rect[data-tip]:hover,.ins svg rect[data-tip]:focus{stroke:var(--ink);stroke-width:1.2}
.ax{font:500 10px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.ax.strong{fill:var(--ink);font-weight:700}
.ax.val{fill:var(--ink);font-weight:700}
.ax.inv{fill:var(--surface);font-weight:700}
.finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.finds li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.finds p{margin:0;font-size:.95rem;min-width:0}
.finds b,.num{font-variant-numeric:tabular-nums}
.ftag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:6px;margin-top:2px;min-width:68px;text-align:center;
  background:color-mix(in srgb,var(--fc) 14%,var(--surface));color:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 40%,transparent)}
.ftag.good{--fc:var(--gad)} .ftag.watch{--fc:var(--pos)} .ftag.link{--fc:var(--accent)} .ftag.info{--fc:var(--muted)}
.fine{font-size:.8rem;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:10px}
.mini{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0;padding-top:0}
.mname{font-weight:700;display:inline-flex;align-items:center;gap:7px}
.mname i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.dir{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.dir.good{color:var(--gad);border-color:color-mix(in srgb,var(--gad) 45%,transparent)}
.dir.bad{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,transparent)}
.dir.flat{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--ink);display:inline-block}
.topgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.tops{display:flex;flex-direction:column;gap:6px;min-width:0}
.tbar{position:relative;display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:5px 8px;border-radius:6px;overflow:hidden}
.tbar span,.tbar b{position:relative;z-index:1}
.tbar em{font-style:normal;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbar s{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.16;text-decoration:none}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1.5px dashed var(--accent);border-radius:14px;padding:8px 8px 8px 14px;font-size:.82rem;line-height:1.3}
.demo .ghost{padding:7px 12px;font-size:.8rem;white-space:nowrap}
.demo span{flex:1 1 200px}

.hero{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));gap:16px}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.hero h2{font-size:1.45rem;margin-top:2px}
h3{font:700 1.1rem/1.2 var(--display);margin:0}
.links{display:flex;flex-direction:column;gap:12px}
.link{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.link p{margin:0;font-size:.92rem}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.food{font:700 1rem var(--display)}
.arrow{color:var(--muted)}
.effect{font-weight:700;font-size:.85rem;padding:2px 9px;border-radius:999px;color:var(--fx);background:color-mix(in srgb,var(--fx) 13%,var(--surface))}
.link.w{--fx:var(--worse)} .link.b{--fx:var(--better)}
.conf{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:700}
.pips{display:inline-flex;gap:3px}.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--fx,var(--accent))}
.db{width:100%;height:auto;display:block;overflow:visible}
.dbkey{display:flex;gap:14px;font-size:.75rem;color:var(--muted)}
.dbkey span{display:inline-flex;align-items:center;gap:5px}
.dbkey i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dbkey i.o{border:2px solid var(--muted);background:var(--surface)}
.dbkey i.f{background:linear-gradient(90deg,var(--worse) 50%,var(--better) 50%)}
.sub{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.fchips .chip{font-size:.82rem;padding:6px 11px}
.cnt{font-size:.72rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.prof{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.prow{display:flex;flex-direction:column;gap:0}
.pl{font-weight:700;font-size:.9rem}

.meds{display:flex;flex-direction:column;gap:12px}
.med{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.miss{color:var(--worse)}

.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px;scroll-padding-inline:16px}
.pills::-webkit-scrollbar{display:none}
.pgrp{flex:0 0 auto;align-self:center;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-left:10px;border-left:1.5px solid var(--line);margin-left:4px}
.pill{flex:0 0 auto;font:700 .82rem var(--body);padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.pill[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.carousel{display:flex;align-items:stretch;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
  margin-inline:-16px;padding:2px 16px 6px;scroll-padding-inline:16px;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 18px);height:clamp(440px,66svh,660px);overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:thin;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;box-shadow:0 1px 0 var(--line),0 8px 24px -18px color-mix(in srgb,var(--ink) 40%,transparent)}
.slide > div:first-child > .lbl,.slide > .lbl:first-child{font:700 1.2rem/1.2 var(--display);text-transform:none;letter-spacing:0;color:var(--ink);display:block}
.slide > div:first-child{display:flex;flex-direction:column;gap:4px}
.slide .hint{margin:0}
.carnav{display:flex;align-items:center;justify-content:center;gap:12px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.3rem/1 var(--body);cursor:pointer}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:200px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}

<body>

<div class="wrap">
  <header><span class="today" id="today"></span><h1 id="secTitle">Log</h1></header>
  <div class="banner" id="banner" hidden>This browser isn't letting Symptom Log save data, so entries may vanish. Open it from your Home Screen, not a private tab, and try again.</div>
  <nav id="tabs" class="typebar" role="tablist" aria-label="What to log"></nav>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="toast" hidden></div>
<div class="updbar" id="upd" hidden><span>A new version is ready.</span><button class="ghost" id="updBtn">Update</button></div>

<script>
/* ---------- Insights ---------- */
const COND=['ibs','fibro','mdd','gad'], DAY=864e5;
let insRange=30, demo=null;
function dkey(d){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function daysBack(n){const t=new Date();t.setHours(12,0,0,0);const o=[];for(let i=n-1;i>=0;i--)o.push(dkey(new Date(t-i*DAY)));return o}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const f1=x=>x==null?'–':(Math.round(x*10)/10).toFixed(1);
const dlabel=d=>new Date(d+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const H=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pearson(a,b){const ma=mean(a),mb=mean(b);let sab=0,sa=0,sb=0;a.forEach((x,i)=>{const p=x-ma,q=b[i]-mb;sab+=p*q;sa+=p*p;sb+=q*q});return sa&&sb?sab/Math.sqrt(sa*sb):null}

function analyze(list){
  let days;
  if(insRange==='all'){const first=list.length?list.map(e=>e.ts).sort()[0].slice(0,10):dkey(new Date());
    days=daysBack(Math.min(365,Math.max(14,Math.round((Date.now()-new Date(first+'T12:00'))/DAY)+1)))}
  else days=daysBack(insRange);
  const inDays=new Set(days), inR=list.filter(e=>inDays.has(e.ts.slice(0,10)));
  const daily={};COND.forEach(k=>daily[k]={});
  const sleep={},walk={};
  inR.forEach(e=>{const d=e.ts.slice(0,10);
    if(daily[e.c]&&e.sev!=null)daily[e.c][d]=Math.max(daily[e.c][d]??-1,e.sev);
    if(e.c==='sleep'&&e.f?.hrs!=null)sleep[d]=e.f.hrs;
    if(e.c==='walk')walk[d]=(walk[d]||0)+(e.f?.mins||0)});
  const A={days,inR,daily,sleep,walk,list};
  // trends
  A.trend={};COND.forEach(k=>{const v=ds=>mean(ds.map(d=>daily[k][d]).filter(x=>x!=null));
    const last=days.slice(-7),prev=days.slice(-14,-7);
    const nl=last.filter(d=>daily[k][d]!=null).length,np=prev.filter(d=>daily[k][d]!=null).length;
    A.trend[k]={now:v(last),before:v(prev),nl,np,all:v(days)}});
  // paired comparisons
  const pair=(test)=>COND.map(k=>{const a=[],b=[];days.forEach(d=>{const s=daily[k][d];if(s==null)return;const t=test(d);if(t===true)a.push(s);else if(t===false)b.push(s)});
    return {k,a:mean(a),an:a.length,b:mean(b),bn:b.length}});
  A.sleepCmp=pair(d=>sleep[d]==null?null:sleep[d]<7);
  A.walkCmp=pair(d=>!!walk[d]);
  // meals → IBS-D
  const ibs=list.filter(e=>e.c==='ibs').map(e=>+new Date(e.ts));
  const meals=inR.filter(e=>e.c==='meal').map(m=>{const t=+new Date(m.ts);
    return {tags:m.g?.has||[],hit:m.f?.after==='Symptoms'||ibs.some(x=>x>t&&x<=t+8*36e5)}});
  const tags={};meals.forEach(m=>m.tags.forEach(t=>{(tags[t]??={n:0,h:0}).n++;if(m.hit)tags[t].h++}));
  A.meals={n:meals.length,base:meals.length?meals.filter(m=>m.hit).length/meals.length:null,
    tags:Object.entries(tags).map(([t,s])=>({t,...s,r:s.h/s.n})).filter(x=>x.n>=2).sort((a,b)=>b.r-a.r||b.n-a.n)};
  // time of day
  A.tod={};COND.forEach(k=>{const c=[0,0,0,0];inR.filter(e=>e.c===k).forEach(e=>c[Math.floor(+e.ts.slice(11,13)/6)]++);A.tod[k]=c});
  // top tags
  A.top={};COND.forEach(k=>{const cnt={};inR.filter(e=>e.c===k).forEach(e=>Object.entries(e.g||{}).forEach(([g,arr])=>{if(g==='help'||g==='cope')return;arr.forEach(t=>{const key=t+'|'+(g==='trig'?'trigger':'');cnt[key]=(cnt[key]||0)+1})}));
    A.top[k]=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([key,n])=>{const [t,kind]=key.split('|');return {t,kind,n}})});
  // correlations
  A.corr={};for(let i=0;i<4;i++)for(let j=0;j<i;j++){const a=[],b=[],ki=COND[i],kj=COND[j];
    days.forEach(d=>{if(daily[ki][d]!=null&&daily[kj][d]!=null){a.push(daily[ki][d]);b.push(daily[kj][d])}});
    A.corr[ki+kj]={r:a.length>=5?pearson(a,b):null,n:a.length,a:ki,b:kj}}
  return A}

function findings(A){const out=[];const nm=k=>C[k].full||C[k].name, sh=k=>C[k].main.short;
  COND.forEach(k=>{const t=A.trend[k];if(t.nl>=3&&t.np>=3){const d=t.now-t.before;if(Math.abs(d)>=1)
    out.push({s:Math.abs(d),kind:d<0?'good':'watch',tag:d<0?'Easing':'Rising',txt:`Your ${sh(k)} for ${nm(k)} averaged <b>${f1(t.now)}</b> this past week, ${d<0?'down':'up'} from ${f1(t.before)} the week before.`})}});
  A.sleepCmp.forEach(r=>{if(r.an>=3&&r.bn>=3&&r.a-r.b>=1)out.push({s:r.a-r.b+.5,kind:'link',tag:'Sleep',txt:`After nights under 7 hours, your ${sh(r.k)} (${C[r.k].name}) averaged <b>${f1(r.a)}</b>, compared with ${f1(r.b)} after 7 hours or more.`})});
  (A.allLinks||[]).filter(l=>l.level>=2).slice(0,3).forEach(l=>out.push({s:3+l.score,kind:l.c.worse>0?'watch':'good',tag:l.unit==='day'?(l.f.key.startsWith('m')?'Meds':'Habit'):'Food',txt:l.o.virtual?`<b>${H(l.f.name)}</b> → ${l.o.full} ${l.c.diff>0?'more':'less'} often: ${Math.round(l.c.rw*100)}% vs ${Math.round(l.c.ro*100)}% ${l.unit==='day'?'of other days':'after other meals'}.`:`<b>${H(l.f.name)}</b> → ${l.o.full} ${l.c.diff>0?'up':'down'}: ${f1(l.c.w)} vs ${f1(l.c.wo)} ${l.unit==='day'?'on other days':'after other meals'} (${l.c.hits} of ${l.c.n} times).`}));
  (A.meds||[]).forEach(m=>m.ba.forEach(x=>{if(x.n>=3&&x.b-x.a>=1.5)out.push({s:2+(x.b-x.a)/2,kind:'good',tag:'Meds',txt:`After <b>${H(m.name.toLowerCase())}</b>, your ${({ibs:'IBS-D severity',fibro:'pain',mdd:'low mood',gad:'anxiety'})[x.k]} went from ${f1(x.b)} to <b>${f1(x.a)}</b> on average (${x.n} doses).`})}));
  (A.meds||[]).forEach(m=>{if(m.missed>=2&&m.taken-m.asNeeded>0)out.push({s:1.2,kind:'watch',tag:'Meds',txt:`You logged <b>${m.missed} missed doses</b> of ${H(m.name.toLowerCase())} in this period.`})});
  Object.values(A.corr).forEach(v=>{if(v.r!=null&&v.n>=7&&v.r>=.5){const a=v.a,b=v.b;
    out.push({s:v.r*3,kind:'link',tag:'Together',txt:`${C[a].name} and ${C[b].name} tend to flare on the same days (correlation ${v.r.toFixed(2)} across ${v.n} days).`})}});
  const blocks=['overnight (12–6am)','in the morning','in the afternoon','in the evening'];
  COND.forEach(k=>{const c=A.tod[k],n=c.reduce((a,b)=>a+b,0),mx=Math.max(...c);if(n>=6&&mx/n>=.5)out.push({s:1,kind:'info',tag:'Timing',txt:`${Math.round(mx/n*100)}% of your ${C[k].name} entries were logged ${blocks[c.indexOf(mx)]}.`})});
  COND.forEach(k=>{const t=A.top[k].find(x=>x.kind==='trigger');if(t&&t.n>=3)out.push({s:.8,kind:'info',tag:'Trigger',txt:`<b>${H(t.t)}</b> is the trigger you've tagged most often for ${C[k].name} (${t.n} times).`})});
  {const {pr}=relaxStats(A),b=pr.find(x=>x.n>=3&&x.d>=1.5);if(b)out.push({s:2.2+b.d/3,kind:'good',tag:'Relax',txt:`<b>${H(b.p)}</b> lowers your stress or tension by <b>${f1(b.d)}</b> points on average (${b.n} sessions).`})}
  {const es=inR(A,'leisure').filter(e=>e.f?.level!=null),t=es.reduce((a,e)=>a+(e.f?.mins||0),0),hm=es.filter(e=>+e.f.level<=-1).reduce((a,e)=>a+(e.f?.mins||0),0);
    if(es.length>=4&&t&&hm/t>=.2)out.push({s:1.8,kind:'watch',tag:'Leisure',txt:`<b>${Math.round(hm/t*100)}%</b> of your leisure time was rated harmful or destructive.`});
    const c=hcell(A,'l:mean','mood');if(c&&c.d!=null&&c.diff<=-1)out.push({s:2.1,kind:'good',tag:'Leisure',txt:`On days with meaningful or cathartic leisure, your low mood averaged <b>${f1(c.w)}</b>, compared with ${f1(c.wo)}.`})}
  {const c=hcell(A,'s:hard','mood');if(c&&c.d!=null&&c.diff>=1.5)out.push({s:2,kind:'watch',tag:'Self-care',txt:`On days self-care felt hard, your low mood averaged <b>${f1(c.w)}</b>, compared with ${f1(c.wo)}.`})}

        :`<rect x="${x+.5}" y="${y}" width="${Math.max(cw-1,1)}" height="${rh}" rx="2" fill="var(${C[k].color})" opacity="${(.18+.82*v/10).toFixed(2)}" ${tipAttr(`${v}/10 ${C[k].main.short}\n${C[k].name} · ${dlabel(d)}`)}/>`})});

function corrGrid(A){const cs=50,L=56,T=4;let s=`<svg viewBox="0 0 ${L+cs*3+4} ${T+cs*3+22}" style="max-width:260px" role="img" aria-label="Same-day correlation between conditions">`;

function makeDemo(){const out=[],now=new Date();let id=0;const R=(a,b)=>a+Math.random()*(b-a),cl=v=>Math.max(0,Math.min(10,Math.round(v))),P=p=>Math.random()<p;

  const canon=w=>{for(const c of [w.slice(0,-1),w.slice(0,-2),w.slice(0,-3)+'y'])if(w.endsWith('s')&&c.length>=3&&wc[c]!=null&&c!==w)return c;return w};

  const tagNames=new Set();mealsAll.forEach(m=>(m.g?.has||[]).forEach(t=>tagNames.add(t.toLowerCase())));

    (m.g?.has||[]).forEach(tag=>x.set('t:'+tag,{key:'t:'+tag,name:tag,src:'tag'}));

    if(twin){twin.alias.push(f.name.toLowerCase());meals.forEach(m=>{if(m.x.has(f.key))m.x.set(twin.key,twin)})}else kept.push(f)});

    <div class="dbkey"><span><i class="o"></i>other meals</span><span><i class="f"></i>with ${H(sel.name.toLowerCase())}</span></div></div></section>`;

/* ---------- Daily habits & meds ---------- */
const medKey=n=>{const k=(n||'').toLowerCase().replace(/\d.*$/,'').replace(/[^a-z\s-]/g,'').trim();return k||(n||'').toLowerCase().trim()};
const nextDay=d=>dkey(new Date(new Date(d+'T12:00').getTime()+DAY));
const HB_WHEN={gut:'on days with',pain:'on days with',mood:'on days with',anx:'on days with',energy:'on days with',sleep:'the night after days with'};

function habits(list,days){
  const U={};days.forEach(d=>U[d]={d,x:new Map(),logged:new Set(),lightMin:0});
  const X=(u,key,name,pop)=>u.x.set(key,{key,name,pop});
  const ibsOn=list.some(e=>e.c==='ibs');
  list.forEach(e=>{const d=e.ts.slice(0,10),u=U[d];if(!u)return;const f=e.f||{},h=+e.ts.slice(11,13);
    if(e.c==='walk')X(u,'h:walk','Walking',null);
    if(e.c==='light'){u.logged.add('light');const bright=f.src==='Outdoor daylight'||f.src==='Light therapy lamp';
      if(bright)u.lightMin+=f.mins||0;
      if(bright&&h<11)X(u,'h:morn','Morning light','light');
      if(f.src==='Light therapy lamp')X(u,'h:lamp','Light therapy lamp','light');
      if(f.src==='Dim indoor'&&(f.mins||0)>=180)X(u,'h:dim','Long dim stretch (3h+)','light')}
    if(e.c==='screen'){u.logged.add('screen');
      if((f.hrs||0)>=6)X(u,'h:scr6','6h+ screen time','screen');
      if(['30–60 min','Whole hour'].includes(f.bed))X(u,'h:bed','Screens before bed','screen');
      if((e.g?.type||[]).includes('Social media'))X(u,'h:soc','Mostly social media','screen');
      if((e.g?.type||[]).includes('News'))X(u,'h:news','Mostly news','screen')}
    if(e.c==='leisure'){X(u,'l:any','Leisure time',null);u.leis=(u.leis||0)+(f.mins||0);
      if(f.who==='With others')X(u,'l:soc','Social time',null);
      if(f.kind==='Creative')X(u,'l:cre','Creative time',null);if(f.kind==='Outdoors')X(u,'l:out','Outdoor leisure',null);
      if(f.energy==='Drained')X(u,'l:drn','A draining activity',null);
      if(f.level!=null){const lv=+f.level;if(lv<=-1)X(u,'l:harm','Harmful leisure (−1/−2)',null);else if(lv===1)X(u,'l:pas','Passive leisure (+1)',null);else if(lv===2)X(u,'l:act','Active leisure (+2)',null);else if(lv>=3)X(u,'l:mean','Meaningful leisure (+3/+4)',null)}}
    if(e.c==='relax'){X(u,'r:any','Relaxation practice',null);if(h>=19)X(u,'r:eve','Evening relaxation',null);if(f.prac)X(u,'r:'+f.prac,f.prac,null)}
    if(e.c==='selfcare'){u.logged.add('selfcare');(e.g?.done||[]).forEach(t=>X(u,'s:'+t,t,'selfcare'));
      if((f.water||0)>=6)X(u,'s:water','6+ glasses of water','selfcare');if(f.effort==='Hard')X(u,'s:hard','Self-care felt hard','selfcare')}
    if(e.c==='meds'&&f.name){u.logged.add('meds');const k=medKey(f.name);
      if(f.how==='Missed dose')X(u,'mm:'+k,'Missed '+k,'meds');else if(f.how!=='As needed')X(u,'m:'+k,cap(k),'meds')}});
  days.forEach(d=>{if(U[d].lightMin>=30)X(U[d],'h:out','30+ min daylight','light');if((U[d].leis||0)>=120)X(U[d],'l:long','2h+ of leisure',null)});
  // outcomes per day
  const day=e=>e.ts.slice(0,10),mx=a=>a.length?Math.max(...a):null;
  days.forEach(d=>{const on=c=>list.filter(e=>e.c===c&&day(e)===d);
    const en=[...on('mdd').map(e=>e.f?.energy).filter(v=>v!=null),...on('fibro').map(e=>e.f?.fatigue).filter(v=>v!=null).map(v=>10-v)];
    const sl=list.find(e=>e.c==='sleep'&&day(e)===nextDay(d));
    const ib=on('ibs').map(e=>e.sev);
    U[d].o={gut:ib.length?mx(ib):(ibsOn?0:null),pain:mx(on('fibro').map(e=>e.sev)),mood:mx(on('mdd').map(e=>e.sev)),anx:mx(on('gad').map(e=>e.sev)),energy:en.length?mean(en):null,sleep:sl?sl.sev:null,...Object.fromEntries(OUT.slice(OUT_BASE.length).map(o=>[o.id,mx(list.filter(e=>e.c==='other'&&day(e)===d&&symKey(e)===o.id&&e.sev!=null).map(e=>e.sev))??0]))}});
  const units=Object.values(U);
  const ex=new Map();units.forEach(u=>u.x.forEach(v=>{if(!ex.has(v.key))ex.set(v.key,{...v,n:0});ex.get(v.key).n++}));
  const items=[...ex.values()].filter(f=>f.n>=3).map(f=>{f.cells={};
    OUT.forEach(o=>{const w=[],wo=[];units.forEach(u=>{const v=u.o[o.id];if(v==null)return;if(f.pop&&!u.logged.has(f.pop))return;(u.x.has(f.key)?w:wo).push(v)});
      if(w.length<3||wo.length<3){f.cells[o.id]={n:w.length,nwo:wo.length};return}
      const mw=mean(w),mo=mean(wo),sd=Math.sqrt(([...w.map(v=>(v-mw)**2),...wo.map(v=>(v-mo)**2)].reduce((a,b)=>a+b,0))/(w.length+wo.length-2))||1;
      const diff=mw-mo,worse=diff*(o.pol===-1?1:-1),hits=w.filter(v=>(v-mo)*(worse>0?1:-1)*(o.pol===-1?1:-1)>0).length;
      f.cells[o.id]={w:mw,wo:mo,n:w.length,nwo:wo.length,p:pval(w,wo),diff,worse,d:diff/sd,hits,rw:w.filter(v=>v>0).length/w.length,ro:wo.filter(v=>v>0).length/wo.length}});
    f.score=Math.max(0,...OUT.map(o=>Math.abs(f.cells[o.id].d||0)));return f}).sort((a,b)=>b.score-a.score);
  const links=[];items.forEach(f=>OUT.forEach(o=>{const c=f.cells[o.id];if(c.d==null)return;const ad=Math.abs(c.d);
    if(ad<.4||Math.abs(c.diff)<.8)return;links.push({unit:'day',f,o,c,level:ad>=.8&&c.n>=5?3:ad>=.55&&c.n>=4?2:1,score:ad*Math.sqrt(Math.min(c.n,c.nwo))})}));
  links.sort((a,b)=>b.score-a.score);
  return {items,links}}

function habitText(l){const {f,o,c}=l;if(f.key.startsWith('s:')&&!['s:water','s:hard'].includes(f.key)){const lead=o.id==='sleep'?`The night after days you ticked “${H(f.name.toLowerCase())}”`:`On days you ticked “${H(f.name.toLowerCase())}”`;
    return o.virtual?`${lead}, you had ${o.full} on <b>${Math.round(c.rw*100)}%</b> of them, compared with ${Math.round(c.ro*100)}% of other days (${c.n} days).`:`${lead}, your ${o.full} averaged <b>${f1(c.w)}</b>, compared with ${f1(c.wo)} on other days. That happened ${c.hits} of ${c.n} times.`}
  const nm=f.key.startsWith('m:')?`you took ${H(f.name.toLowerCase())}`:f.key.startsWith('mm:')?`you ${H(f.name.toLowerCase())}`:H(f.name.toLowerCase());
  const lead=f.key.startsWith('m')?(o.id==='sleep'?`The night after days ${nm}`:`On days ${nm}`):(o.id==='sleep'?`The night after days with ${nm}`:`On days with ${nm}`);
  if(o.virtual)return `${lead}, you had ${o.full} on <b>${Math.round(c.rw*100)}%</b> of them, compared with ${Math.round(c.ro*100)}% of other days (${c.n} days).`;
  return `${lead}, your ${o.full} averaged <b>${f1(c.w)}</b>, compared with ${f1(c.wo)} on other days. That happened ${c.hits} of ${c.n} times.`}

function impactGrid(rows,label){const Lw=104,cw=(W-Lw)/OUT_BASE.length,rh=26,T=16;
  let s=`<svg viewBox="0 0 ${W} ${T+rows.length*rh+2}" role="img" aria-label="${H(label)}">`;
  OUT_BASE.forEach((o,j)=>s+=`<text x="${Lw+cw*j+cw/2}" y="10" class="ax strong" text-anchor="middle">${o.label}</text>`);
  rows.forEach((f,i)=>{const y=T+i*rh;s+=`<text x="0" y="${y+rh/2+3.5}" class="ax strong">${H(f.name.length>17?f.name.slice(0,16)+'…':f.name)}</text>`;
    OUT_BASE.forEach((o,j)=>{const c=f.cells[o.id],x=Lw+cw*j;
      if(c.d==null){s+=`<rect x="${x+1.5}" y="${y+1.5}" width="${cw-3}" height="${rh-3}" rx="4" fill="var(--line)" opacity=".35" ${tipAttr(`Not enough data yet\n${f.name} · ${o.full} (${c.n} days)`)}/>`;return}
      const op=(.12+.88*Math.min(Math.abs(c.d)/1.2,1)).toFixed(2);
      s+=`<rect x="${x+1.5}" y="${y+1.5}" width="${cw-3}" height="${rh-3}" rx="4" fill="${c.worse>0?'var(--worse)':'var(--better)'}" opacity="${op}" ${tipAttr(`${f1(c.w)} vs ${f1(c.wo)} ${o.full}\n${f.name}: ${c.n} days · others: ${c.nwo}${(c.q??1)>.1?'\nNot reliable yet':''}`)}/>
        <text x="${x+cw/2}" y="${y+rh/2+3.5}" text-anchor="middle" class="ax ${Math.abs(c.d)>=.7?'inv':'strong'}" pointer-events="none">${c.diff>0?'+':'−'}${f1(Math.abs(c.diff))}</text>`})});
  return s+'</svg>'}

function habitsSection(Hb){
  if(!Hb.items.length)return `<section class="card" data-t="Habits"><div><span class="lbl">Daily habits</span><p class="hint">Once you've logged light, screen time, meds and walks on a few days, this compares days with each habit against days without.</p></div></section>`;
  return `<section class="card" data-t="Habits"><div><span class="lbl">Daily habits</span><p class="hint">Change in each score on days with the habit (sleep: that night), compared with other days you logged that kind of thing.</p></div>
    <div class="legend"><span><i style="background:var(--worse)"></i>Worse</span><span><i style="background:var(--better)"></i>Better</span><span><i style="background:var(--line)"></i>Not enough data</span></div>
    ${impactGrid(Hb.items.slice(0,10),'Daily habits impact map')}</section>`}

const MED_COND={ibs:'IBS-D',fibro:'Pain',mdd:'Mood',gad:'Anxiety'};
function medsInfo(list,days){const inDays=new Set(days),T=e=>+new Date(e.ts);
  const doses=list.filter(e=>e.c==='meds'&&e.f?.name&&inDays.has(e.ts.slice(0,10))),M={};
  doses.forEach(e=>{const k=medKey(e.f.name),m=M[k]??={k,name:cap(k),label:e.f.name,kind:e.f.kind,taken:0,missed:0,asNeeded:0,days:new Set(),fx:{},doses:[]};
    if(e.f.how==='Missed dose'){m.missed++;return}m.taken++;if(e.f.how==='As needed')m.asNeeded++;m.days.add(e.ts.slice(0,10));m.label=e.f.name;if(e.f.kind)m.kind=e.f.kind;
    (e.g?.sym||[]).filter(x=>x!=='None').forEach(x=>m.fx[x]=(m.fx[x]||0)+1);m.doses.push(T(e))});
  return Object.values(M).sort((a,b)=>b.taken-a.taken).map(m=>{m.ba=COND.map(k=>{const ev=list.filter(e=>e.c===k).map(e=>({t:T(e),v:e.sev}));const pairs=[];
      m.doses.forEach(t=>{const pre=ev.filter(e=>e.t<=t&&e.t>=t-6*36e5).sort((a,b)=>b.t-a.t)[0],post=ev.filter(e=>e.t>t+36e5&&e.t<=t+12*36e5);
        if(pre&&post.length)pairs.push([pre.v,mean(post.map(e=>e.v))])});
      return pairs.length>=2?{k,b:mean(pairs.map(p=>p[0])),a:mean(pairs.map(p=>p[1])),n:pairs.length}:null}).filter(Boolean);
    return m})}

function baBar(x){const L=4,R=W-4,h=30,s=v=>L+(v/10)*(R-L),y=13,better=x.a<x.b,col=better?'var(--better)':'var(--worse)';
  return `<svg viewBox="0 0 ${W} ${h}" class="db" role="img" aria-label="${MED_COND[x.k]}: ${f1(x.b)} before, ${f1(x.a)} after">
   <line x1="${L}" x2="${R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
   <line x1="${s(x.b)}" x2="${s(x.a)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3" opacity=".55"/>
   <circle cx="${s(x.b)}" cy="${y}" r="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" ${tipAttr(`${f1(x.b)}/10 before\nlast entry in the 6h before a dose`)}/>
   <circle cx="${s(x.a)}" cy="${y}" r="7" fill="${col}" stroke="var(--surface)" stroke-width="2" ${tipAttr(`${f1(x.a)}/10 after\naverage 1–12h after · ${x.n} doses`)}/>
   <text x="${L}" y="${h}" class="ax">0</text><text x="${R}" y="${h}" class="ax" text-anchor="end">10</text></svg>`}

function medsSection(Ms,days){
  if(!Ms.length)return `<section class="card" data-t="Meds"><div><span class="lbl">Medications &amp; supplements</span><p class="hint">Log each dose on the Meds tab, including missed ones, to see how consistently you take them and how symptoms change after a dose.</p></div></section>`;
  return `<section class="card" data-t="Meds"><div><span class="lbl">Medications &amp; supplements</span><p class="hint">Symptoms before a dose compared with the 12 hours after, plus how consistently each one was taken.</p></div>
   <div class="meds">${Ms.map(m=>{const sched=m.taken-m.asNeeded;const fx=Object.entries(m.fx).sort((a,b)=>b[1]-a[1]).slice(0,3);
     return `<article class="med"><div class="row"><h3>${H(m.name)}</h3><span class="tag" style="--c:var(--meds)">${H(m.kind||'Logged')}</span></div>
      <div class="stats"><span><b>${m.taken}</b> doses</span>${sched?`<span>Taken on <b>${m.days.size}</b> of ${days.length} days</span>`:''}${m.asNeeded?`<span><b>${m.asNeeded}</b> as needed</span>`:''}${m.missed?`<span class="miss">Missed <b>${m.missed}</b></span>`:''}</div>
      ${fx.length?`<p class="hint" style="margin:0">Side effects noted: ${fx.map(([n,c])=>`${H(n.toLowerCase())} (${c})`).join(', ')}</p>`:''}
      ${m.ba.map(x=>`<div class="prow"><div class="row"><span class="pl">${MED_COND[x.k]}</span><span class="hint">${f1(x.b)} → ${f1(x.a)} after · ${x.n} doses</span></div>${baBar(x)}</div>`).join('')}
      ${!m.ba.length&&m.asNeeded?`<p class="hint" style="margin:0">Log the symptom before and after a dose to see if it helps.</p>`:''}</article>`}).join('')}</div>
   <div class="dbkey"><span><i class="o"></i>before a dose</span><span><i class="f"></i>after</span></div>
   <p class="fine">For daily medications, effects build over weeks, so steadiness of symptoms over time (see Trends) says more than single doses. Never change a prescription without talking to your doctor.</p></section>`}


let calCond='ibs',calSel=null;
function calData(A,k){const m={};
  if(k==='sleep'){A.list.filter(e=>e.c==='sleep').forEach(e=>{const d=e.ts.slice(0,10);if(A.days.includes(d))m[d]={v:e.sev,bad:e.sev!=null?10-e.sev:null,txt:`Sleep quality ${e.sev??'–'}/10${e.f?.hrs!=null?` · ${e.f.hrs}h slept`:''}${e.f?.wakes!=null?` · woke ${e.f.wakes}×`:''}`}});return m}
  A.days.forEach(d=>{const es=A.list.filter(e=>keyOf(e)===k&&e.ts.slice(0,10)===d&&e.sev!=null);if(!es.length)return;const v=Math.max(...es.map(e=>e.sev));
    m[d]={v,bad:v,txt:`Highest ${C[k].main.short} ${v}/10 · ${es.length} ${es.length===1?'entry':'entries'} (${es.map(e=>e.ts.slice(11,16)).join(', ')})`}});return m}
function calendarCard(A){const k=calCond,m=calData(A,k),col=`var(${C[k].color})`;
  const first=new Date(A.days[0]+'T12:00'),lead=first.getDay(),cells=[];
  for(let i=0;i<lead;i++)cells.push('<span class="cday blank"></span>');
  A.days.forEach((d,i)=>{const x=m[d],dt=new Date(d+'T12:00'),dn=dt.getDate(),showM=dn===1||i===0;
    const pct=x&&x.bad!=null?Math.round(15+85*x.bad/10):0,isT=i===A.days.length-1;
    cells.push(`<button class="cday${x?' has':''}${calSel===d?' sel':''}${isT?' today':''}" data-cal="${d}" style="${x?`background:color-mix(in srgb,${col} ${pct}%,var(--surface));${pct>55?'color:var(--surface)':''}`:''}" aria-label="${dt.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})}${x?': '+x.v+' out of 10':': nothing logged'}"><span>${showM?`<em>${dt.toLocaleDateString('en-CA',{month:'short'}).replace('.','')}</em> `:''}${dn}</span>${x?`<b>${x.v}</b>`:''}</button>`)});
  const opts=[...COND,...(A.syms||[]).map(x=>x.k),'sleep'];
  const sel=calSel&&A.days.includes(calSel)?calSel:null;
  return `<section class="card" data-t="Calendar"><div><span class="lbl">${k==='sleep'?'Sleep calendar':'Symptom calendar'}</span><p class="hint">${k==='sleep'?'Darker means a worse night.':'Darker means a worse day.'} Tap a day for details.</p></div>
    <div class="${opts.length>5?'seg':'segc'} calopts">${opts.map(o=>`<button class="chip" data-calc="${o}" style="--c:var(${C[o].color})" aria-pressed="${o===k}">${C[o].name}</button>`).join('')}</div>
    <div class="calgrid" style="--c:${col}">${['S','M','T','W','T','F','S'].map(w=>`<span class="cwk">${w}</span>`).join('')}${cells.join('')}</div>
    <div class="caldetail" id="calDetail">${sel?calDetail(m,sel,k):'Tap a day to see what was logged.'}</div>
    <div class="legend"><span><i style="background:color-mix(in srgb,${col} 20%,var(--surface))"></i>${k==='sleep'?'Good night':'Mild'}</span><span><i style="background:${col}"></i>${k==='sleep'?'Poor night':'Severe'}</span><span><i style="background:var(--bg);border:1px solid var(--line)"></i>Nothing logged</span></div></section>`}
function calDetail(m,d,k){const x=m[d],dl=new Date(d+'T12:00').toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'});
  return `<b>${dl}</b><br>${x?H(x.txt):(k==='sleep'?'No sleep logged for this morning.':`No ${C[k].name} entries.`)}`}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-calc],[data-cal]');if(!b)return;

/* ---------- Sleep & timing cards ---------- */
const prevDay=d=>dkey(new Date(new Date(d+'T12:00').getTime()-DAY));
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(Math.round(m%60)).padStart(2,'0')}`;
function dayTags(list,d){const set=new Set();let out=0;
  list.forEach(e=>{if(e.ts.slice(0,10)!==d)return;const f=e.f||{},h=+e.ts.slice(11,13);
    if(e.c==='meal'){(e.g?.has||[]).forEach(t=>set.add(t));if(h>=20)set.add('Ate after 8pm');if(f.portion==='Large')set.add('Large portion')}
    if(e.c==='screen'){if(['30–60 min','Whole hour'].includes(f.bed))set.add('Screens before bed');if((f.hrs||0)>=6)set.add('6h+ screen time')}
    if(e.c==='walk')set.add('Walked');
    if(e.c==='light'){const b=f.src==='Outdoor daylight'||f.src==='Light therapy lamp';if(b&&h<11)set.add('Morning light');if(b)out+=f.mins||0}
    if(e.c==='meds'&&f.name){const k=medKey(f.name);if(f.how==='Missed dose')set.add('Missed '+k);else if(f.how!=='As needed')set.add(cap(k))}
    if(e.c==='leisure'){set.add('Leisure time');if(f.who==='With others')set.add('Social time');if(f.energy==='Drained')set.add('A draining activity');
      if(f.level!=null){const lv=+f.level;if(lv<=-1)set.add('Harmful leisure');else if(lv>=3)set.add('Meaningful leisure')}}
    if(e.c==='relax'){set.add(h>=19?'Evening relaxation':'Relaxation practice');if(f.prac)set.add(f.prac)}
    if(e.c==='selfcare'){(e.g?.done||[]).forEach(t=>set.add(t));if((f.water||0)>=6)set.add('6+ glasses of water');if(f.effort==='Hard')set.add('Self-care felt hard')}

  open(){return new Promise((res,rej)=>{const q=indexedDB.open('symptomlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}};
async function boot(){

    if(Array.isArray(v))entries=v;
    else{const ls=localStorage.getItem(KEY);if(ls){entries=JSON.parse(ls);await IDB.set('entries',entries)}}}
  catch(e){storageOk=false;try{const ls=localStorage.getItem(KEY);if(ls)entries=JSON.parse(ls)}catch(_){}}
  try{if(navigator.storage?.persist)persisted=await navigator.storage.persist()}catch(e){}
  if(!storageOk)$('#banner').hidden=false;
  render()}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

  if(e.f?.sleephrs!=null&&e.c==='mdd')out.push(`${e.f.sleephrs}h sleep`);
  return out}

  if(c.main) h+=`<div class="field"><div class="row"><label class="lbl" for="${id('sev')}">${c.main.label}</label><span class="big" data-out="sev">${s.sev}<small>/10</small></span></div>

    `<button type="button" class="chip" data-g="${g.id}" data-v="${esc(o)}" aria-pressed="${s.g[g.id].includes(o)}">${esc(o)}</button>`).join('')}</div></div>`});

function refreshSlide(k){const el=document.querySelector(`.lslide[data-k="${k}"]`);if(el)el.innerHTML=formHTML(k)}
function setupLog(){const car=$('#lcar');if(!car)return;const sl=[...car.children],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit=()=>{const a=sl[LOG.indexOf(tab)];if(a)car.style.height=(a.offsetHeight+8)+'px'};
  const go=(i,smooth)=>{i=Math.max(0,Math.min(sl.length-1,i));car.scrollTo({left:sl[i].offsetLeft-sl[0].offsetLeft,behavior:smooth&&!reduce?'smooth':'auto'})};
  const mark=i=>{const k=LOG[i],changed=k!==tab;tab=k;lastLog=k;try{localStorage.setItem(TABKEY,k)}catch(e){}
    document.body.style.setProperty('--c',cvar(k));
    document.querySelectorAll('#tabs .tchip').forEach(c=>c.setAttribute('aria-selected',c.dataset.tab===k));
    const tb=$('#tabs'),a=tb.querySelector(`[data-tab="${k}"]`);if(a)tb.scrollTo({left:a.offsetLeft-tb.clientWidth/2+a.offsetWidth/2,behavior:reduce?'auto':'smooth'});
    const lb=document.querySelector('.tabbar button');if(lb)lb.dataset.tab=k;
    const sb=$('#saveBtn');if(sb)sb.textContent='Save '+SAVE[k];
    fit();
    if(changed){const top=car.getBoundingClientRect().top+scrollY-70;if(scrollY>top+10)scrollTo({top,behavior:reduce?'auto':'smooth'})}};
  go(LOG.indexOf(tab),false);mark(LOG.indexOf(tab));
  car.addEventListener('scroll',()=>{clearTimeout(car.t);car.t=setTimeout(()=>{const x=car.scrollLeft;let best=0,bd=1e9;
    sl.forEach((s,i)=>{const d=Math.abs(s.offsetLeft-sl[0].offsetLeft-x);if(d<bd){bd=d;best=i}});if(LOG[best]!==tab)mark(best)},70)},{passive:true});
  if(window.ResizeObserver){const ro=new ResizeObserver(fit);sl.forEach(x=>ro.observe(x))}
  setTimeout(fit,50);logGo=go}

   <p class="hint" style="margin:0">Moving from the old version? In the old app, tap <b>Copy backup</b> in Sheet or History, then paste it here.</p></div></div></div>`;

function csv(){const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const lines=[['Date','Time','Log','Score (0-10)','Details','Symptoms / effects','Triggers / contains / type','What helped / taken for','Notes'].join(',')];
  entries.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).forEach(e=>{const [d,t]=e.ts.split('T');
    lines.push([d,t,C[e.c].full||C[e.c].name,e.sev??'',details(e).join('; '),groupText(e,['sym','area','mind','eff','emo','cog','oth','feel','done']),groupText(e,['trig','has','type']),groupText(e,['help','cope','for']),e.notes||''].map(q).join(','))});
  return lines.join('\n')}
function copy(text,label){const box=$('#outBox');
  const fallback=()=>{box.hidden=false;box.value=text;box.focus();box.select();toast('Select all and copy the text below')};
  try{navigator.clipboard.writeText(text).then(()=>{box.hidden=true;toast(label)},fallback)}catch(e){fallback()}}

document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){const t=b.dataset.tab;armed=null;
    if(C[t]&&C[tab]&&$('#lcar')&&logGo){logGo(LOG.indexOf(t),true);return}
    tab=t;try{localStorage.setItem(TABKEY,tab)}catch(e){}render();window.scrollTo(0,0);return}
  const sl=b.closest('.lslide'),k=sl?.dataset.k,s=k?D(k):null;
  if(b.dataset.f&&s){const f=b.dataset.f,fd=C[k].fields.find(x=>x.id===f);if(fd?.noUnset&&s.f[f]===b.dataset.v)return;s.f[f]=s.f[f]===b.dataset.v?undefined:b.dataset.v;
    if(fd?.rerender){refreshSlide(k);return}
    b.parentElement.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',s.f[f]===x.dataset.v));return}
  if(b.dataset.g&&s){const a=s.g[b.dataset.g],v=b.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);b.setAttribute('aria-pressed',i<0);return}
  if(b.dataset.step&&s){const f=C[k].fields.find(x=>x.id===b.dataset.step);s.f[f.id]=Math.round(Math.min(f.max,Math.max(f.min,s.f[f.id]+(f.step||1)*b.dataset.d))*10)/10;sl.querySelector(`[data-out="${f.id}"]`).textContent=s.f[f.id];return}
  if(b.dataset.filter){sheetFilter=b.dataset.filter;armed=null;render();return}
  if(b.dataset.del){if(armed===b.dataset.del){entries=entries.filter(e=>e.id!==armed);armed=null;save();toast('Entry deleted')}else armed=b.dataset.del;
    if(sl)refreshSlide(k);else render();return}
  if(b.id==='saveBtn'){const k2=tab,s2=D(k2),slide=document.querySelector(`.lslide[data-k="${k2}"]`);
    const req=C[k2].fields.find(f=>f.req&&!s2.f[f.id]);if(req){toast(`Add “${req.label}” first`);slide?.querySelector(`[data-text="${req.id}"]`)?.focus();return}
    const f={};Object.entries(s2.f).forEach(([x,v])=>{if(v!==undefined)f[x]=v});
    const g={};C[k2].groups.forEach(x=>g[x.id]=(!x.cat||x.cat===(s2.f.cat||'Physical'))?[...s2.g[x.id]]:[]);
    entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),c:k2,ts:s2.ts||nowLocal(),sev:s2.sev,f,g,notes:(s2.notes||'').trim()});
    const ok=save();drafts[k2]=fresh(k2);armed=null;refreshSlide(k2);
    const car=$('#lcar');if(car){const top=car.getBoundingClientRect().top+scrollY-70;if(scrollY>top)scrollTo({top,behavior:'smooth'})}
    toast(ok?'Saved to your log':'Saved for now, but this browser won’t keep it');return}
  if(b.id==='csvBtn'){copy(csv(),'CSV copied, paste into Numbers or Excel');return}
  if(b.id==='bakBtn'){copy(JSON.stringify({app:'symptomlog',v:1,entries}),'Backup copied');return}
  if(b.id==='restoreBtn'){try{mergeBackup(JSON.parse($('#restore').value))}catch(e){toast('That doesn’t look like a backup. Paste the whole copied text.')}return}
  if(b.id==='csvFile'){shareFile(`Symptom Log ${new Date().toISOString().slice(0,10)}.csv`,csv(),'text/csv','Symptom Log export');return}
});

const BKEY='symptomlog.lastBackup';
const lastBackup=()=>{try{return +localStorage.getItem(BKEY)||0}catch(e){return 0}};
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function shareFile(name,data,type,title){const file=new File([data],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title});return 'shared'}catch(e){if(e&&e.name==='AbortError')return 'cancelled'}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return 'downloaded'}
async function backupNow(){if(!entries.length){toast('Nothing to back up yet');return}
  const d=new Date().toISOString().slice(0,10),res=await shareFile(`Symptom Log backup ${d}.json`,JSON.stringify({app:'symptomlog',v:1,saved:new Date().toISOString(),entries}),'application/json','Symptom Log backup');
  if(res==='cancelled'){toast('Backup cancelled');return}
  try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}
  toast(res==='shared'?'Backup saved':'Backup downloaded');if(!C[tab])render();else document.querySelectorAll('.bkbar').forEach(x=>x.remove())}
function mergeBackup(d){const list=Array.isArray(d)?d:d?.entries;if(!Array.isArray(list))throw 0;
  const have=new Set(entries.map(e=>e.id));let n=0;list.forEach(e=>{if(e&&e.id&&C[e.c]&&!have.has(e.id)){entries.push(e);n++}});save();render();
  toast(n?`Restored ${n} ${n===1?'entry':'entries'}`:'Nothing new in that backup')}
function bkBar(){if(!entries.length)return '';const lb=lastBackup(),days=lb?Math.floor((Date.now()-lb)/864e5):null;
  if(lb&&days<7)return '';
  return `<div class="bkbar"><span><b>${lb?`Last backup ${days} days ago`:'Back up your log'}</b><br>Save a copy to Files or iCloud Drive in case your phone is lost or reset.</span><button class="ghost" data-backup>Back up</button></div>`}
function installCard(){if(standalone())return '';try{if(localStorage.getItem('symptomlog.installHidden'))return ''}catch(e){}
  return `<div class="bkbar inst"><span><b>Install Symptom Log</b><br>In Safari, tap Share, then <b>Add to Home Screen</b>. Installed, it works offline and your data is kept safely.</span><button class="linkbtn" data-hideinst aria-label="Dismiss">Not now</button></div>`}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-backup],[data-hideinst],[data-repeat]');if(!b)return;
  if(b.hasAttribute('data-backup')){backupNow();return}
  if(b.hasAttribute('data-hideinst')){try{localStorage.setItem('symptomlog.installHidden','1')}catch(e){}b.closest('.bkbar').remove();return}
  if(b.dataset.repeat){const k=b.dataset.repeat,last=entries.filter(e=>e.c===k).sort((a,c)=>c.ts.localeCompare(a.ts))[0];if(!last)return;
    const fr=fresh(k),g={};C[k].groups.forEach(x=>g[x.id]=[...(last.g?.[x.id]||[])]);
    drafts[k]={...fr,sev:last.sev??fr.sev,f:{...fr.f,...JSON.parse(JSON.stringify(last.f||{}))},g,notes:''};refreshSlide(k);toast('Filled in from your last entry. Adjust anything that changed.')}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id!=='restoreFile'||!t.files?.[0])return;
  t.files[0].text().then(x=>{try{mergeBackup(JSON.parse(x))}catch(e){toast('That file isn’t a Symptom Log backup.')}t.value=''})});
// service worker + updates
if('serviceWorker' in navigator){let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>{
    const ask=()=>{if(reg.waiting&&navigator.serviceWorker.controller){$('#upd').hidden=false;$('#updBtn').onclick=()=>reg.waiting?.postMessage('skip')}};ask();
    reg.addEventListener('updatefound',()=>{const n=reg.installing;n?.addEventListener('statechange',()=>{if(n.state==='installed')ask()})});
    setInterval(()=>reg.update().catch(()=>{}),36e5)}).catch(()=>{}))}

document.addEventListener('input',ev=>{const t=ev.target;if(t.type==='range')t.style.setProperty('--p',t.value*10+'%');
  const sl=t.closest?.('.lslide');if(!sl)return;const s=D(sl.dataset.k),out=x=>sl.querySelector(`[data-out="${x}"]`);
  if(t.hasAttribute('data-main')){s.sev=+t.value;out('sev').innerHTML=`${s.sev}<small>/10</small>`}
  if(t.dataset.scale){s.f[t.dataset.scale]=+t.value;out(t.dataset.scale).innerHTML=`${t.value}<small>/10</small>`}
  if(t.dataset.text)s.f[t.dataset.text]=t.value.trim()||undefined;
  if(t.hasAttribute('data-ts'))s.ts=t.value; if(t.hasAttribute('data-notes'))s.notes=t.value;
});
$('#today').textContent=new Date().toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'});
boot();
</script>
</body>
